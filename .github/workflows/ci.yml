name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/client.js && node --check tools/patch-chip-font.mjs
      - name: Host tests
        run: node --test tests/host.test.mjs
